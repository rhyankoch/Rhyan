
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        <style>
            header{
              background-color: #183c63;  
              color: #FFFFFF;
              text-align: center;
              max-width: 800px;
              margin: 0 auto;
              padding: 16px;
              border: 5px solid #ff0000;
            }
            main{
                background-color: #FFFFFF;
                color: #183c63;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img{
                width: 80px;
                height: 80px;
            }
            .artigo-autor{
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <img src="" alt="">
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimento sobre tecnologia e programacao </p>
        
    </header>
    <main> 
        <img src="imagem-blog.png" alt="Ilustracao de tecnologia e educacao com um notebook exibindo circuitos digitais, um livro aberto e um capelo de formatura sobre fundo azul escuro.">
        <div>
        <h2>Meu primeiro post</h2>
        <p class="artigo-autor">Por: Rhyan Koch</p>
        <p>Boas-vindas aou meu novo blog! Aqui vou compartilha dicas de programacao e curiosidades da area de programacao</p>
        <button>❤️ <span>0</span>​</button>
        <button>🙌​ <span>0</span>​</button>
        </div>
        
    </main>
    </body>
    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach( function(botao){
            botao.addEventListener("click", botaoClicado);
            
            function botaoClicado(){
                console.log("fui clicado");
                let texto = botao.querySelector("span");
                texto.textContent++;
        }
        )

        }
    </script>
</html>
