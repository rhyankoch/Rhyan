
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
header {
background-color: #78e00070;
color: #FFFFFF;
text-align: center;
max-width: 800px;
margin: 0 auto;
padding: 16px;
border: 5px solid #9dff00;
}
main {
background-color: #FFFFFF;
color: #00ff00;
display: flex;
flex-direction: column;
align-items: center;
max-width: 800px;
margin: 0 auto;
padding: 16px;
}
img {
width: 90px;
height: 90px;
border-radius: 50%;
}
button {
font-size: 24px;
padding: 10px 20px;
cursor: pointer;
margin-top: 20px;
}
</style>
</head>

<body>
<header>
<img src="/Gemini_Generated_Image_1hddd71hddd71hdd.png" alt="tecnologia">
<div>
<h1>Meu blog tech</h1>
<p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
</div>
</header>
<main>
<h2>Meu primeiro post</h2>
<p>por: Rhyan Koch</p>
<p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
<!-- Botão de curtidas posicionado corretamente dentro do main -->
<button>❤️ <span>0</span></button>
<button>👍 <span>0</span></button>
</main>

<!-- Script JavaScript para fazer o contador funcionar -->
<script>
const botao = document.querySelector("button");
botao.addEventListener("click", botaoClicado);

function botaoClicado() {
let texto = botao.querySelector("span");
texto.textContent++;
}
</script>
</body>
</html>
